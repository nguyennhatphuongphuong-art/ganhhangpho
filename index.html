<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gánh Hàng Phố — Gameplay Render</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#222;font-family:system-ui;color:#2b2119}#app{max-width:430px;min-height:100vh;margin:auto;background:#f7ead2}.top{display:flex;gap:5px;padding:8px;background:#fff5e3;position:sticky;top:0;z-index:3}.s{flex:1;padding:6px 4px;background:white;border:1px solid #dfc9a8;border-radius:10px;text-align:center;font-size:11px;font-weight:800}.scene{height:320px;position:relative;background:linear-gradient(#a9dcef 0 52%,#777 52%);overflow:hidden}.sun{position:absolute;right:25px;top:20px;font-size:35px}.house{position:absolute;bottom:130px;width:100%;height:100px;background:#e5ad75;border-top:5px solid #83583d;padding:18px;font-weight:900}.tree{position:absolute;bottom:112px;font-size:48px}.t1{left:5px}.t2{right:5px}.cart{position:absolute;left:50%;bottom:55px;transform:translateX(-50%);width:205px;height:100px;background:#c77b38;border:5px solid #633918;border-radius:14px}.sign{position:absolute;left:20px;right:20px;top:-42px;background:#ffe39b;border:4px solid #633918;border-radius:10px;text-align:center;padding:5px;font-weight:900}.person{position:absolute;right:18px;bottom:110px;font-size:68px;display:none}.bubble{position:absolute;right:7px;top:15px;background:#fff;border:2px solid #333;border-radius:12px;padding:8px;max-width:205px;font-size:12px;font-weight:700;display:none}.panel{padding:10px;border-top:1px solid #dec5a0}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:1px solid #d8c09e;background:#fff;border-radius:11px;padding:10px;font-weight:800}.primary{background:#e7953e;color:#fff}.row{display:flex;gap:7px;overflow:auto}.card{background:#fff;border:1px solid #ddc7a7;border-radius:12px;padding:9px;margin:7px 0}.ings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.ing{padding:6px;border:1px solid #d8c09e;background:#fff;border-radius:10px;font-size:10px;font-weight:800}.ing b{display:block;font-size:23px}.tag{display:inline-block;background:#f0dbb7;border-radius:8px;padding:5px;margin:2px;font-size:11px}
</style>
<div id="app">
<div class="top"><div class="s">💰 <span id="money">10.000.000</span>đ</div><div class="s">⭐ <span id="rep">50</span></div><div class="s">📅 <span id="day">1</span></div><div class="s">🕐 <span id="time">07:00</span></div></div>
<div id="world" class="scene hidden"><div class="sun">☀️</div><div class="house">PHỐ NHỎ</div><div class="tree t1">🌳</div><div class="tree t2">🌳</div><div class="cart"><div class="sign">🥖 GÁNH HÀNG PHỐ</div></div><div id="person" class="person">🧑🏻</div><div id="bubble" class="bubble"></div></div>
<div id="home" class="panel"><h3>🏠 Nhà</h3><div class="grid"><button class="btn primary" onclick="locations()">🚚 Đi bán hàng</button><button class="btn" onclick="market()">🛒 Đi chợ</button><button class="btn" onclick="stock()">📦 Kho hàng</button><button class="btn" onclick="rest()">🛌 Nghỉ ngơi</button><button class="btn" onclick="assets()">🏪 Tài sản</button><button class="btn" onclick="ledger()">📒 Công nợ</button></div></div>
<div id="locs" class="panel hidden"><h3>📍 Chọn địa điểm</h3><div class="row"><button class="btn" onclick="loc('Hẻm dân cư')">🏘️ Hẻm dân cư</button><button class="btn" onclick="loc('Văn phòng')">🏢 Văn phòng</button><button class="btn" onclick="loc('Trường học')">🏫 Trường học</button><button class="btn" onclick="loc('Khu chợ')">🛒 Khu chợ</button><button class="btn" onclick="loc('Công viên')">🌳 Công viên</button><button class="btn" onclick="loc('Phố đêm')">🌙 Phố đêm</button></div></div>
<div id="groups" class="panel hidden"><h3>🍜 Chọn nhóm món</h3><div class="row"><button class="btn" onclick="start('bread')">🥖 Bánh mì</button><button class="btn" onclick="start('xoi')">🍚 Xôi</button><button class="btn" onclick="start('coffee')">☕ Cà phê</button><button class="btn" onclick="start('noodle')">🍜 Hủ tiếu</button></div></div>
<div id="sell" class="panel hidden"><div class="card">📍 <b id="where"></b> · <b id="group"></b><div id="order" style="margin-top:7px"></div></div><div class="card"><b>🧑‍🍳 Bàn chế biến</b><div id="prep" style="min-height:38px;margin-top:7px">Chưa có nguyên liệu</div><div id="ings" class="ings" style="margin-top:8px"></div><div class="row" style="margin-top:8px"><button class="btn" onclick="resetDish()">↩️ Làm lại</button><button id="serve" class="btn primary" disabled onclick="serve()">🍽️ Phục vụ</button><button class="btn" onclick="home()">🏠 Về nhà</button></div></div><div id="msg"></div></div>
<div id="extra" class="panel hidden"></div>
<script>
const I={bread:[['bread','🥖','Bánh mì'],['meat','🥩','Thịt nguội'],['pate','🟤','Pate'],['egg','🥚','Trứng'],['sausage','🌭','Xúc xích'],['chicken','🍗','Gà xé'],['beef','🥩','Bò nướng'],['fish','🐟','Chả cá'],['pork','🍖','Heo quay'],['pickle','🥒','Đồ chua'],['cucumber','🥒','Dưa leo'],['herb','🌿','Rau thơm'],['chili','🌶️','Ớt'],['hot','🌶️','Tương ớt'],['mayo','🥣','Mayonnaise'],['onion','🧅','Hành phi']],xoi:[['sticky','🍚','Nếp'],['bean','🫘','Đậu xanh'],['black','🫘','Đậu đen'],['coconut','🥥','Cốt dừa'],['sugar','🍬','Đường'],['oil','🫗','Dầu'],['egg','🥚','Trứng'],['chicken','🍗','Gà xé'],['pork','🍖','Thịt kho'],['sausage','🌭','Lạp xưởng'],['onion','🧅','Hành phi']],coffee:[['coffee','☕','Cà phê'],['sugar','🍬','Đường'],['cond','🥛','Sữa đặc'],['milk','🥛','Sữa tươi'],['ice','🧊','Đá'],['salt','🧂','Kem muối'],['coconut','🥥','Cốt dừa'],['egg','🥚','Trứng'],['cocoa','🍫','Cacao']],noodle:[['noodle','🍜','Hủ tiếu'],['meat','🥩','Thịt'],['shrimp','🦐','Tôm'],['egg','🥚','Trứng cút'],['liver','🥩','Gan'],['greens','🥬','Rau'],['bone','🦴','Xương'],['beefball','🟤','Bò viên'],['onion','🧅','Hành'],['satay','🌶️','Sa tế'],['peanut','🥜','Đậu phộng'],['squid','🦑','Mực'],['fish','🐟','Cá']]};
const R={bread:[['Bánh mì thịt nguội',['bread','meat','pickle','cucumber','herb']],['Bánh mì trứng ốp la + xúc xích',['bread','egg','sausage','pickle']],['Bánh mì gà xé',['bread','chicken','pickle','cucumber','herb']],['Bánh mì chả cá',['bread','fish','pickle','cucumber','herb']],['Bánh mì heo quay',['bread','pork','pickle','cucumber']],['Bánh mì thịt nướng + trứng',['bread','beef','egg','pickle','herb']]],xoi:[['Xôi đậu xanh',['sticky','bean','coconut','sugar']],['Xôi gà',['sticky','chicken','onion']],['Xôi thịt kho',['sticky','pork','egg','onion']]],coffee:[['Cà phê đen',['coffee','sugar','ice']],['Cà phê sữa',['coffee','cond','ice']],['Bạc xỉu',['coffee','cond','milk','ice']],['Cà phê trứng',['coffee','egg','milk','sugar']]],noodle:[['Hủ tiếu Nam Vang',['noodle','meat','shrimp','egg','liver','greens']],['Hủ tiếu thịt',['noodle','meat','greens','onion']],['Hủ tiếu bò viên',['noodle','beefball','greens','onion']]]};
let S={money:10000000,rep:50,day:1,min:420,loc:'',g:'',recipe:null,chosen:[],customer:false};
const all=Object.fromEntries(Object.values(I).flat().map(x=>[x[0],x]));
function stats(){money.textContent=S.money.toLocaleString('vi-VN');rep.textContent=S.rep;day.textContent=S.day;time.textContent=String(Math.floor(S.min/60)).padStart(2,'0')+':'+String(S.min%60).padStart(2,'0')}
setInterval(()=>{S.min++;if(S.min>=1440){S.min=360;S.day++}stats()},1000);
function hide(){['home','locs','groups','sell','extra','world'].forEach(x=>document.getElementById(x).classList.add('hidden'))}
function locations(){hide();locs.classList.remove('hidden')}
function loc(x){S.loc=x;hide();groups.classList.remove('hidden')}
function start(g){S.g=g;S.chosen=[];hide();world.classList.remove('hidden');sell.classList.remove('hidden');where.textContent=S.loc;group.textContent={bread:'🥖 Bánh mì',xoi:'🍚 Xôi',coffee:'☕ Cà phê',noodle:'🍜 Hủ tiếu'}[g];renderI();customer()}
function renderI(){ings.innerHTML='';I[S.g].forEach(x=>{let b=document.createElement('button');b.className='ing';b.innerHTML='<b>'+x[1]+'</b>'+x[2];b.onclick=()=>add(x[0]);ings.appendChild(b)})}
function customer(){S.customer=true;person.style.display='block';bubble.style.display='block';S.recipe=R[S.g][Math.floor(Math.random()*R[S.g].length)];S.chosen=[];resetDish();bubble.textContent='Cho mình '+S.recipe[0]+' nhé!';order.innerHTML='<b>📋 Đơn:</b> '+S.recipe[0]+'<br><small>'+S.recipe[1].map(k=>all[k][2]).join(' → ')+'</small>'}
function add(k){let need=S.recipe[1],p=S.chosen.length;if(k!==need[p]){S.rep=Math.max(0,S.rep-2);msg.textContent='❌ Sai nguyên liệu — món bị hỏng, làm lại.';resetDish();return}S.chosen.push(k);prep.innerHTML=S.chosen.map(x=>'<span class="tag">'+all[x][1]+' '+all[x][2]+'</span>').join('');if(S.chosen.length===need.length){serve.disabled=false;msg.textContent='✅ Đúng công thức!'}else msg.textContent='Đúng rồi, tiếp tục.'}
function resetDish(){S.chosen=[];prep.textContent='Chưa có nguyên liệu';serve.disabled=true}
function serve(){if(S.chosen.length!==S.recipe[1].length)return;let p=35000+S.chosen.length*5000;S.money+=p;S.rep=Math.min(100,S.rep+1);S.customer=false;person.style.display='none';bubble.style.display='none';serve.disabled=true;msg.textContent='💰 +'+p.toLocaleString('vi-VN')+'đ. Khách rời đi.';stats();setTimeout(()=>{if(!S.customer&&!sell.classList.contains('hidden'))customer()},3000)}
function home(){hide();homeEl=document.getElementById('home');homeEl.classList.remove('hidden');S.customer=false;person.style.display='none';bubble.style.display='none'}
function market(){hide();extra.classList.remove('hidden');extra.innerHTML='<h3>🛒 Đi chợ</h3><p>Chọn nhóm để chỉ xem nguyên liệu của nhóm đó.</p><div class="row"><button class="btn" onclick="marketG(\'bread\')">🥖 Bánh mì</button><button class="btn" onclick="marketG(\'xoi\')">🍚 Xôi</button><button class="btn" onclick="marketG(\'coffee\')">☕ Cà phê</button><button class="btn" onclick="marketG(\'noodle\')">🍜 Hủ tiếu</button></div><div id="mi"></div><button class="btn" onclick="home()">🏠 Về nhà</button>'}
function marketG(g){mi.innerHTML='<h3>Nguyên liệu '+({bread:'Bánh mì',xoi:'Xôi',coffee:'Cà phê',noodle:'Hủ tiếu'}[g])+'</h3>';I[g].forEach(x=>mi.innerHTML+='<div class="card"><b>'+x[1]+' '+x[2]+'</b><br>Giá hôm nay: 2.000đ <button class="btn" onclick="buy(\''+x[0]+'\')">Mua 1</button></div>')}
function buy(k){if(S.money<2000){alert('Không đủ tiền');return}S.money-=2000;S.stock=S.stock||{};S.stock[k]=(S.stock[k]||0)+1;stats()}
function stock(){hide();extra.classList.remove('hidden');extra.innerHTML='<h3>📦 Kho hàng</h3>'+(Object.entries(S.stock||{}).map(([k,v])=>'<div class="card">'+all[k][1]+' '+all[k][2]+' × '+v+'</div>').join('')||'<div class="card">Kho đang trống.</div>')+'<button class="btn" onclick="home()">🏠 Về nhà</button>'}
function assets(){hide();extra.classList.remove('hidden');extra.innerHTML='<h3>🏪 Tài sản</h3><div class="card">🛒 Xe gỗ cơ bản — Cấp 1</div><button class="btn" onclick="home()">🏠 Về nhà</button>'}
function ledger(){hide();extra.classList.remove('hidden');extra.innerHTML='<h3>📒 Sổ công nợ</h3><div class="card">Chưa có công nợ.</div><button class="btn" onclick="home()">🏠 Về nhà</button>'}
function rest(){S.min=S.min<630?630:S.min<870?870:S.min<1110?1110:360;if(S.min===360)S.day++;stats();home()}
stats();
</script></html>
