 document.getElementById('screen').innerHTML=`<button class="back" onclick="home()">← Về nhà</button><h2>🏪 Tài sản</h2>
 <div class="asset-card"><b>🚚 Xe hàng · Cấp ${c.level}</b><div class="meta">${c.n}<br>Dung lượng: ${c.cap} · Tốc độ phục vụ +${c.speed}</div>${state.assets.cart<cartAssets.length?`<button class="btn primary" onclick="buyCart()">Nâng cấp · ${moneyFmt(cartAssets[state.assets.cart].cost)}</button>`:'<span class="pill">Đã đạt cấp tối đa</span>'}</div>
 <div class="asset-card"><b>🛵 Phương tiện</b><div class="meta">${v.n}<br>Bonus vận chuyển +${v.bonus}</div>${state.assets.vehicle<vehicleAssets.length-1?`<button class="btn" onclick="buyVehicle()">Mua ${vehicleAssets[state.assets.vehicle+1].n} · ${moneyFmt(vehicleAssets[state.assets.vehicle+1].cost)}</button>`:''}</div>
 <div class="asset-card"><b>🏠 Bất động sản</b><div class="meta">${p.n}<br>Thu nhập thụ động: ${moneyFmt(p.passive)}/ngày</div>${state.assets.property<propertyAssets.length-1?`<button class="btn" onclick="buyProperty()">Mua ${propertyAssets[state.assets.property+1].n} · ${moneyFmt(propertyAssets[state.assets.property+1].cost)}</button>`:''}</div>
 <div class="asset-card"><b>💼 Kinh doanh thụ động</b><div class="meta">Tài sản bất động sản sẽ tạo doanh thu khi bạn nghỉ qua ngày, đồng thời có chi phí vận hành.</div></div>`;
}
function buyCart(){let a=cartAssets[state.assets.cart];if(state.money<a.cost){toast('Không đủ tiền.');return}state.money-=a.cost;state.assets.cart++;toast('Xe hàng đã nâng cấp!');assets()}
function buyVehicle(){let a=vehicleAssets[state.assets.vehicle+1];if(state.money<a.cost){toast('Không đủ tiền.');return}state.money-=a.cost;state.assets.vehicle++;toast('Đã mua phương tiện.');assets()}
function buyProperty(){let a=propertyAssets[state.assets.property+1];if(state.money<a.cost){toast('Không đủ tiền.');return}state.money-=a.cost;state.assets.property++;state.assets.passive=a.passive;toast('Đã mua bất động sản.');assets()}
function ledger(){state.scene='ledger';document.getElementById('screen').innerHTML=`<button class="back" onclick="home()">← Về nhà</button><h2>📒 Sổ công nợ</h2><div class="card">${state.ordersDebt.length?state.ordersDebt.map((d,i)=>`<div class="list-row"><div><b>${d.name}</b><br><span class="small">Ngày ${d.day} · ${d.status}</span></div><b>${moneyFmt(d.amount)}</b><button class="btn" onclick="collectDebt(${i})">Thu</button></div>`).join(''):'Chưa có khoản nợ.'}</div>`}
function collectDebt(i){let d=state.ordersDebt[i];state.money+=d.amount;state.ordersDebt.splice(i,1);toast('Đã thu công nợ.');ledger()}
function loans(){state.scene='loans';document.getElementById('screen').innerHTML=`<button class="back" onclick="home()">← Về nhà</button><h2>💰 Vay vốn</h2>
 <div class="card"><b>🏦 Ngân hàng</b><br>Vay 15.000.000đ · phí 8% · trả sau 3 ngày<br><button class="btn primary" onclick="takeLoan('Ngân hàng',15000000,.08,3)">Vay ngay</button></div>
 <div class="card"><b>🤝 Bạn bè</b><br>Vay 5.000.000đ · phí 3% · trả sau 2 ngày<br><button class="btn" onclick="takeLoan('Bạn bè',5000000,.03,2)">Vay ngay</button></div>
 <div class="card"><b>🧾 Khoản vay đang có</b>${state.loans.length?state.loans.map((l,i)=>`<div class="list-row"><div>${l.name}<br><span class="small">Đến hạn ngày ${l.due}</span></div><b>${moneyFmt(l.dueAmount)}</b><button class="btn" onclick="repayLoan(${i})">Trả</button></div>`).join(''):'<br><span class="muted">Không có khoản vay.</span>'}</div>`}
function takeLoan(name,amount,fee,days){state.money+=amount;state.loans.push({name,amount,due:state.day+days,dueAmount:Math.round(amount*(1+fee))});toast('Đã nhận khoản vay.');loans()}
function repayLoan(i){let l=state.loans[i];if(state.money<l.dueAmount){toast('Chưa đủ tiền trả.');return}state.money-=l.dueAmount;state.loans.splice(i,1);toast('Đã trả khoản vay.');loans()}
function business(){state.scene='business';document.getElementById('screen').innerHTML=`<button class="back" onclick="home()">← Về nhà</button><h2>📈 Kinh doanh</h2><div class="card"><b>Doanh thu hôm nay:</b> ${moneyFmt(state.shiftRevenue)}<br><b>Đã phục vụ:</b> ${state.shiftServed}<br><b>Uy tín:</b> ${state.rating}/100<br><b>Tiền mặt:</b> ${moneyFmt(state.money)}</div><div class="card"><b>Chi phí & dòng tiền</b><br>Nguyên liệu đã dùng: ${moneyFmt(state.ingredientCost)}<br>Hao hụt: ${moneyFmt(state.waste)}<br>Chi phí cố định dự kiến cuối ngày: 130.000đ</div>`}
function rest(){
 state.restCount++;state.combo=0;state.customer=null;
 const jokes=['Lại nghỉ nữa? Xe hàng tự bán hay gì?','Khách đang đứng chờ… còn chủ quán đang nằm.','Ngày hôm nay bạn đã làm việc rất chăm chỉ… trong tưởng tượng.','Tốc độ kiếm tiền: 0%. Tốc độ nghỉ: 100%.','Bạn đang kinh doanh hay đang mở dịch vụ nghỉ dưỡng?'];
 if(state.time>=1110||state.restCount%1===0){
  const passive=propertyAssets[state.assets.property].passive;const fixed=130000;const loanDue=state.loans.filter(l=>l.due<=state.day+1).reduce((s,l)=>s+l.dueAmount,0);
  const before=state.money;state.money+=passive-fixed;
  if(state.time>=1110){state.day++;state.time=360;state.restCount=0;state.shiftRevenue=0;state.shiftServed=0;state.ingredientCost=0;state.waste=0;state.loans.forEach(l=>{if(l.due<state.day)l.due=state.day});}
  else state.time=Math.min(1110,state.time+180);
  state.scene='summary';
  document.getElementById('screen').innerHTML=`<h2>🌙 Nghỉ ngơi</h2><div class="card"><b>${state.day>1?'Sang ngày mới!':'Bạn nghỉ một ca.'}</b><br>${jokes[(state.day+state.restCount)%jokes.length]}<br><br>Thu nhập thụ động: +${moneyFmt(passive)}<br>Chi phí vận hành: -${moneyFmt(fixed)}<br><b>Tiền hiện tại: ${moneyFmt(state.money)}</b></div><button class="btn primary" onclick="home()">🏠 Về nhà</button>`;
 }else home();
}
function tick(){
 if(!state.clockStarted){state.clockStarted=true;return}
 if(state.scene==='sell'){
  if(state.time<1320){state.time++;if(state.time===630||state.time===870||state.time===1110)toast('Thời gian đã chuyển sang '+phase());}
  if(!state.customer)spawnCustomer();
  if(state.time>=1320){state.customer=null;toast('Đã hết giờ bán. Về nhà và nghỉ để sang ca/ngày tiếp theo.');home()}
 } else {
  // Clock is visible but only advances in selling; home does not advance time.
 }
 updateHud();
}
function updateHud(){const h=document.querySelector('.hud');if(h)h.outerHTML=renderHud()}
setInterval(tick,1000);
render();
</script>
</body>
</html>
